<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon.svg">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Kitten Rescue Math</title>
<link rel="stylesheet" href="../../assets/fonts/fonts.css">
<style>
/* VOICE: warm, giggly storybook for a 5–6 year old
   IDEA: a sunny meadow where lost kittens pop out of bushes and run home to a cottage
   PICTURE: layered meadow scene, outlined chubby kittens, wooden sign, candy buttons
   COLOUR and TYPE: sky blue, meadow green, sunset orange, candy pink; Fredoka rounded
   LAYOUT: one phone-width column, huge tap targets, nothing to read that matters */
:root{color-scheme:light;--sun:#ff8a2a;--ink:#3b2a20;--card:#fffaf0;--pink:#ff5c8a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#76c85c;color:var(--ink);font:18px/1.35 Fredoka,"Baloo 2",system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1}
#app{max-width:520px;margin:0 auto;min-height:100dvh;padding:12px 14px 20px;position:relative}
.screen{display:none;flex-direction:column;align-items:center;gap:10px;min-height:calc(100dvh - 32px);position:relative}
.screen.on{display:flex}
h1,h2{margin:0;font-weight:700;line-height:1.05;text-align:center;text-wrap:balance}
h2{font-size:32px}
.chunky{color:#ff7a3d;text-shadow:3px 3px 0 #fff,-3px 3px 0 #fff,3px -3px 0 #fff,-3px -3px 0 #fff,0 4px 0 #fff,0 9px 0 #c24b1c}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:4px solid #2b7bd6;outline-offset:3px}
svg{overflow:visible}
.top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
.round{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:0 4px 0 rgba(0,0,0,.15);display:grid;place-items:center;padding:0;flex:none;position:relative}
.round svg{width:24px;height:24px}
.gear.hold::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:5px solid var(--sun);animation:ring 1.2s linear}
@keyframes ring{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:5px 14px 5px 6px;box-shadow:0 4px 0 rgba(0,0,0,.12);font-weight:700;font-size:18px}
.pill svg{width:30px;height:30px}
.candy{min-height:80px;padding:8px 30px;border-radius:44px;font-size:34px;font-weight:700;color:#fff;background:linear-gradient(#ffb04a,#ff7a1a);box-shadow:0 9px 0 #d4560a,inset 0 5px 0 rgba(255,255,255,.4);text-shadow:0 3px 0 #c24b1c;display:flex;align-items:center;justify-content:center;gap:12px}
.candy:active{transform:translateY(6px);box-shadow:0 3px 0 #d4560a,inset 0 5px 0 rgba(255,255,255,.4)}
.soft{min-height:52px;padding:6px 18px;border-radius:26px;background:var(--card);font-weight:700;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.14)}
.soft:active,.round:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.14)}
.row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.small{font-size:16px;margin:0;text-align:center;font-weight:600}
.cat{display:block;width:100%;height:auto;overflow:visible}
/* home */
.title{margin-top:2px}
.title h1{font-size:clamp(48px,14vw,62px);line-height:.95}
.title p{margin:10px 0 0;font-size:18px;font-weight:600;color:#2b5a85;text-align:center}
.homeStage{position:relative;width:100%;flex:1;min-height:250px;max-height:340px;display:flex;align-items:flex-end;justify-content:center}
.cushion{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:270px}
.pet{background:none;padding:0;position:relative;z-index:1;margin-bottom:22px;transition:width .6s}
.side{position:absolute;bottom:96px;width:84px;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;z-index:2}
.side.l{left:0}.side.r{right:0}
.side .ring{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;position:relative}
.side .ring svg{width:44px;height:44px}
.side.l .ring{box-shadow:0 0 0 4px #b77ae0,0 6px 0 4px #8a52b8}
.side.r .ring{box-shadow:0 0 0 4px #e2574c,0 6px 0 4px #b8403a}
.side .lbl{font-size:15px;font-weight:700;white-space:nowrap;background:#fffaf0dd;border-radius:10px;padding:0 6px}
.badge{position:absolute;top:-8px;right:-12px;background:#ff7a3d;color:#fff;font-size:15px;font-weight:700;border-radius:12px;padding:0 8px;box-shadow:0 2px 0 #c24b1c;min-width:28px;text-align:center}
.ribbon{background:#e5397a;color:#fff;font-size:26px;font-weight:700;padding:2px 44px 4px;clip-path:polygon(0 0,100% 0,92% 50%,100% 100%,0 100%,8% 50%);text-shadow:0 2px 0 #a81f55;margin:0}
.meterWrap{width:min(310px,86%);position:relative}
.meter{height:30px;border-radius:15px;background:var(--card);box-shadow:inset 0 3px 0 rgba(0,0,0,.08),0 4px 0 rgba(0,0,0,.1);padding:4px}
.meter i{display:block;height:100%;border-radius:11px;background:linear-gradient(#ffc163,#ff8a2a);box-shadow:inset 0 3px 0 rgba(255,255,255,.45);transition:width .8s;min-width:22px}
.meterWrap>svg{position:absolute;right:-16px;top:0;width:44px;height:30px}
#meterTxt{color:#24521d;margin-top:6px}
#petSize{color:#24521d}
.hearts{position:absolute;inset:0;pointer-events:none;z-index:3}
.heart{position:absolute;bottom:150px;font-size:30px;color:#ff5c8a;animation:float 1.4s ease-out forwards}
@keyframes float{to{transform:translateY(-110px) scale(1.4);opacity:0}}
.t-purr{animation:purr .12s 8}
@keyframes purr{50%{transform:translateX(2px) rotate(1deg)}}
.t-hop{animation:hop .6s 2}
@keyframes hop{40%{transform:translateY(-50px)}}
.t-wiggle{animation:wig .25s 5}
@keyframes wig{25%{transform:rotate(-10deg)}75%{transform:rotate(10deg)}}
.t-spin{animation:spin .9s ease-in-out}
@keyframes spin{to{transform:rotate(360deg)}}
.t-roll{animation:roll 1.4s ease-in-out}
@keyframes roll{30%{transform:translateX(-60px) rotate(-360deg)}70%{transform:translateX(60px) rotate(360deg)}}
.t-jump{animation:jump 1.1s ease-in-out}
@keyframes jump{40%{transform:translateY(-140px) rotate(-20deg) scale(1.1)}60%{transform:translateY(-140px) rotate(20deg) scale(1.1)}}
/* play */
.pbar{width:100%;display:flex;align-items:center;gap:8px;position:relative;z-index:2}
.paws{display:flex;gap:2px;flex:1;justify-content:space-between;background:#fffaf0e6;border-radius:999px;padding:6px 12px;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.paw{width:22px;height:22px;fill:#e8dcc8;flex:none}
.paws.many .paw{width:16px;height:16px}
.paw.done{fill:#ff8a2a}.paw.star{fill:#ffc83d}
.paw.now{fill:#ffd9b8;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.3)}}
.streak{position:absolute;right:0;top:58px;z-index:7;margin:0;display:flex;align-items:center;gap:4px;background:var(--pink);color:#fff;border-radius:999px;padding:3px 14px 3px 10px;font-weight:700;font-size:17px;box-shadow:0 4px 0 #c23a65}
.streak:empty{display:none}
.streak.hot{animation:pulse .6s 2}
.scene{position:relative;width:calc(100% + 28px);margin:-70px -14px 0;height:clamp(260px,40dvh,360px);overflow:hidden;border-radius:0 0 30px 30px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.sceneBg{position:absolute;inset:0;width:100%;height:100%}
.bush{position:absolute;z-index:3}
.b1{display:none}
.b2{left:-3%;bottom:-2%;width:47%}
.b3{left:30%;bottom:3%;width:33%}
.lost{position:absolute;left:6%;bottom:9%;width:30%;z-index:2;transition:left 1.3s ease-in-out,opacity .4s,transform .4s;transform:translateY(90%);opacity:0}
.lost.up{opacity:1;animation:popup .55s cubic-bezier(.3,1.6,.5,1) forwards,peek 2s .6s ease-in-out infinite}
@keyframes popup{from{transform:translateY(90%)}to{transform:translateY(0)}}
@keyframes peek{50%{transform:translateY(-8px)}}
.newb{position:absolute;left:0;right:0;top:112px;text-align:center;font-size:24px;font-weight:700;color:#fff;text-shadow:0 2px 0 #e2574c,0 0 8px #ff8a3d;z-index:6;pointer-events:none;animation:popin .4s}
.lost.walk{left:60%!important;z-index:4;opacity:1;transform:none;animation:bob .28s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(4deg)}}
.lost.inside{opacity:0;transform:scale(.3)}
.house{position:absolute;right:1%;bottom:8%;width:37%;z-index:1}
.house.pop{animation:hop .4s}
.hcount{position:absolute;top:30%;right:4%;background:#ff7a3d;color:#fff;font-weight:700;border-radius:14px;min-width:34px;padding:0 9px;text-align:center;font-size:20px;box-shadow:0 3px 0 #c24b1c}
.sign{width:100%;position:relative;border-radius:24px;padding:10px 14px 12px;background:repeating-linear-gradient(#b8743c 0 40px,#a2622f 40px 43px);box-shadow:0 8px 0 #6b3f22,inset 0 3px 0 rgba(255,255,255,.25);border:4px solid #6b3f22;text-align:center;margin-top:8px}
.sign::before,.sign::after{content:"";position:absolute;top:9px;width:8px;height:8px;border-radius:50%;background:#5a3a24}
.sign::before{left:10px}.sign::after{right:10px}
.say{margin:0;font-size:20px;font-weight:600;min-height:27px;color:#ffe9c4}
.prob{display:flex;align-items:center;justify-content:center;gap:10px}
#prob{font-size:clamp(52px,16vw,74px);font-weight:700;line-height:1.05;white-space:nowrap;color:#fff6e3;text-shadow:0 4px 0 #5a3a24}
.hear{width:50px;height:50px;border-radius:50%;background:#5ab8f5;box-shadow:0 4px 0 #2f86c2;display:grid;place-items:center;padding:0;flex:none}
.hear svg{width:26px;height:26px}
.fish{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:3px;background:#fff6e3;border-radius:16px;padding:6px 8px;margin-top:8px}
.fish:empty{display:none}
.fish svg{width:34px;height:22px}
.fish .gone{opacity:.25}
.fish .plus{font-size:26px;font-weight:700;margin:0 6px;color:#94572a}
.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;width:100%;margin-top:10px}
.choice{min-height:108px;border-radius:30px;font-size:60px;font-weight:700;color:#fff;--a:#ff9cc0;--b:#ff5c8a;--c:#c23a65;--t:#a81f55;background:linear-gradient(var(--a),var(--b));box-shadow:0 9px 0 var(--c),inset 0 6px 0 rgba(255,255,255,.4);text-shadow:0 4px 0 var(--t)}
.choice:nth-child(2){--a:#8fd2ff;--b:#3fa6ee;--c:#2378b8;--t:#1d5f94}
.choice:nth-child(3){--a:#ffe07a;--b:#ffb52a;--c:#cc8400;--t:#a86a00}
.choice:active{transform:translateY(6px);box-shadow:0 3px 0 var(--c),inset 0 6px 0 rgba(255,255,255,.4)}
.choice.right{--a:#a6ec8f;--b:#5cc84a;--c:#3d8f2f;--t:#2f7024;animation:pulse .4s}
.choice.wrong{opacity:.3;animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.spark{position:fixed;font-size:28px;pointer-events:none;z-index:50;animation:burst .8s ease-out forwards;color:#ffc83d;text-shadow:0 0 6px #fff}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
/* results */
.burst{position:fixed;inset:0;z-index:-1;background:#ffd0e4;overflow:hidden}
.burst svg{position:absolute;left:50%;top:40%;width:1600px;height:1600px;margin:-800px 0 0 -800px;animation:spin 40s linear infinite}
.banner{position:relative;width:300px;height:76px;margin-top:6px}
.banner .e{position:absolute;top:18px;width:70px;height:54px;background:#c23a3a}
.banner .e.l{left:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,22% 50%)}
.banner .e.r{right:0;clip-path:polygon(0 0,100% 0,78% 50%,100% 100%,0 100%)}
.banner .m{position:absolute;left:30px;right:30px;top:0;height:62px;background:linear-gradient(#ff6b5e,#e2574c);border-radius:8px;box-shadow:0 6px 0 #a83a32;display:grid;place-items:center;padding:0 8px}
.banner h2{font-size:clamp(24px,7vw,32px);color:#fff;text-shadow:0 3px 0 #a83a32}
.rStars{display:flex;align-items:flex-end;gap:8px}
.rStars svg{width:52px;height:52px}.rStars svg:nth-child(2){width:72px;height:72px}
.rStars .off{opacity:.25;filter:grayscale(1)}
.rStars svg{animation:popin .5s backwards}.rStars svg:nth-child(2){animation-delay:.2s}.rStars svg:nth-child(3){animation-delay:.4s}
.rKits{display:flex;flex-wrap:wrap;justify-content:center;gap:2px;max-width:100%}
.rk{width:46px;position:relative}
.rk b{position:absolute;top:-8px;right:-4px;color:#ffc83d;font-size:18px;text-shadow:0 1px 0 #a87b00}
.feed{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:26px;padding:10px 16px;width:100%;box-shadow:0 7px 0 rgba(168,58,50,.22)}
.feed .petMini{width:92px;flex:none;position:relative}
.feed p{margin:0;font-size:22px;font-weight:700}
.flyFish{position:absolute;width:30px;left:30px;top:-40px;animation:fly 1s ease-in forwards}
@keyframes fly{0%{transform:translate(120px,-30px) rotate(-20deg);opacity:0}30%{opacity:1}100%{transform:translate(0,70px) scale(.3);opacity:0}}
.news{width:100%;background:#fff3c4;border-radius:26px;padding:12px;text-align:center;font-size:22px;font-weight:700;box-shadow:0 7px 0 #e8cf70}
.news .nk{width:110px;margin:0 auto 4px}
/* house */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.slot{background:var(--card);border-radius:22px;padding:10px 8px 8px;text-align:center;font-weight:700;font-size:17px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.slot.locked .cat{filter:brightness(0);opacity:.15}
.slot span{display:block;font-size:15px;opacity:.75}
.slot .cat{margin:0 auto 4px;width:86%}
/* overlays */
.overlay{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.overlay[hidden]{display:none}
#parade{background:linear-gradient(#ffd6ec,#bfe6ff 60%,#7cc85f 60%);overflow:hidden}
#parade h2{font-size:44px}
.march{position:relative;width:100%;height:150px}
.marcher{position:absolute;bottom:0;width:96px;animation:walk 7s linear forwards}
.marcher .cat{animation:bob .3s infinite}
@keyframes walk{from{left:-120px}to{left:110%}}
.notes{font-size:36px;color:#6b4fc4;animation:hop .6s infinite}
.conf{position:fixed;top:-20px;width:12px;height:16px;z-index:60;pointer-events:none;animation:fall linear forwards;border-radius:3px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
#settings{background:rgba(40,30,20,.55)}
.panel{background:var(--card);border-radius:26px;padding:18px;width:min(460px,100%);max-height:90dvh;overflow:auto;display:flex;flex-direction:column;gap:12px;font-size:17px}
.panel h2{font-size:28px}
.panel label.l{font-weight:700;display:block;margin-bottom:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:4px 14px;border-radius:14px;background:#efe4d2;font-weight:600}
.seg button.on{background:var(--sun);color:#fff}
.panel input[type=text]{width:100%;font:inherit;font-size:18px;padding:8px 12px;border-radius:12px;border:2px solid #e0c9a6;background:#fff}
.panel .candy{min-height:56px;font-size:24px;padding:4px 24px}
.danger{background:#ffe1dc;color:#b3261e}
/* zoomies */
.zoom{position:absolute;bottom:12%;left:-40%;width:24%;z-index:5;pointer-events:none}
.zoom::before{content:"";position:absolute;right:70%;top:45%;width:260%;height:30%;border-radius:20px;background:linear-gradient(90deg,transparent,#ff5c8a,#ffc83d,#7cd36b,#5fa8e0,#b9a3f0);opacity:.85}
.zoom .cat{position:relative}
.zoom.run{animation:zoomies 1.5s ease-in forwards}
@keyframes zoomies{from{left:-40%}to{left:120%}}
.zban{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;font-weight:700;color:#fff;text-shadow:0 4px 0 #e2574c,0 0 14px #ff8a3d;z-index:6;opacity:0;pointer-events:none}
.zban.run{animation:zb 1.5s ease-out}
@keyframes zb{15%{opacity:1;transform:scale(1.2) rotate(-4deg)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
/* present */
#present{width:100%;display:flex;flex-direction:column;align-items:center}
.gift{width:130px;background:none;padding:0;animation:wig .5s infinite}
.gift .lid{transition:transform .5s,opacity .5s}
.gift.open .lid{transform:translate(20px,-60px) rotate(25deg);opacity:0}
.gift.open{animation:none}
.reveal{background:#fff3c4;border-radius:26px;padding:12px;text-align:center;font-size:22px;font-weight:700;box-shadow:0 7px 0 #e8cf70;width:100%;animation:popin .5s}
.reveal .gk{width:130px;margin:30px auto 4px}
@keyframes popin{from{transform:scale(.4);opacity:0}}
/* wardrobe */
.wbox{position:relative;width:250px;height:250px;perspective:700px;border-radius:24px 24px 10px 10px;background:#6b3f22;padding:10px;box-shadow:0 9px 0 #4a2a15;margin-top:30px}
.wbox::before{content:"";position:absolute;left:-10px;right:-10px;top:-22px;height:26px;border-radius:14px 14px 4px 4px;background:#7d4a27;box-shadow:0 4px 0 #4a2a15}
.winside{width:100%;height:100%;border-radius:14px;background:radial-gradient(circle at 50% 40%,#fff6d8,#ffd98a 60%,#c98a3c);display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px;overflow:visible}
.winside .pet{width:165px;margin:0}
.door{position:absolute;top:10px;bottom:10px;width:calc(50% - 10px);background:repeating-linear-gradient(90deg,#a0602e 0 18px,#94572a 18px 20px);border:3px solid #6b3f22;transition:transform 1.1s cubic-bezier(.3,1.4,.5,1);z-index:2}
.door::after{content:"";position:absolute;top:50%;width:11px;height:11px;border-radius:50%;background:#ffc83d}
.dl{left:10px;transform-origin:left center;border-radius:12px 0 0 6px}.dl::after{right:8px}
.dr{right:10px;transform-origin:right center;border-radius:0 12px 6px 0}.dr::after{left:8px}
.wbox.open .dl{transform:rotateY(-105deg)}.wbox.open .dr{transform:rotateY(105deg)}
.wList h3{margin:12px 0 6px;font-size:22px;color:#24521d}
.wgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wi{background:var(--card);border-radius:18px;padding:22px 4px 6px;font-size:14px;font-weight:600;line-height:1.1;box-shadow:0 4px 0 rgba(0,0,0,.12);text-align:center}
.wi.on{background:#ffe08a;box-shadow:0 0 0 3px var(--sun),0 4px 0 rgba(0,0,0,.12)}
.wi.locked{opacity:.6;padding-top:6px}
.wi span{display:block;margin-top:4px}
.top .chunky{text-shadow:2px 2px 0 #fff,-2px 2px 0 #fff,2px -2px 0 #fff,-2px -2px 0 #fff,0 5px 0 #c24b1c}
.scr-h{color:#fff;text-shadow:0 3px 0 #2f7024}
/* fish catch */
#catch{background:linear-gradient(#5fbcf5,#bfe6ff 70%,#9fd8ff);justify-content:flex-start;padding:0;overflow:hidden;touch-action:none}
.ctop{position:relative;z-index:3;width:100%;max-width:520px;padding:14px;text-align:center}
#catch h2{font-size:30px;color:#fff;text-shadow:0 3px 0 #2b6ea8}
.cbar{height:18px;border-radius:9px;background:#ffffff88;overflow:hidden;margin:8px 0;padding:3px}
.cbar i{display:block;height:100%;width:100%;background:#ffc83d;border-radius:6px}
.cn{margin:0;font-size:24px;font-weight:700;color:#1d4f7a}
.carea{position:absolute;inset:0}
.ff{position:absolute;top:-70px;width:80px;height:56px;padding:0;background:none;animation:drop linear forwards}
.ff svg{width:100%;height:100%;animation:wob .45s infinite alternate}
.ff.gold svg{filter:drop-shadow(0 0 8px #fff38a)}
.ff.got svg{animation:gotit .35s forwards}
@keyframes drop{to{transform:translateY(calc(100dvh + 120px))}}
@keyframes wob{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes gotit{to{transform:scale(1.9);opacity:0}}
.plus1{position:absolute;font-size:30px;font-weight:700;color:#fff;text-shadow:0 2px 0 #e2574c;pointer-events:none;animation:float 1s forwards;z-index:4}
@media (prefers-reduced-motion:reduce){*:not(.ff):not(.marcher):not(.zoom){animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:380px){.wgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.side{width:72px}.side .ring{width:62px;height:62px}}
@media (max-height:720px){.scene{height:230px}.choice{min-height:90px;font-size:50px}.homeStage{min-height:210px}.title h1{font-size:46px}}
</style>
</head>

let ac=null;
function ctx(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume().catch(()=>{});return ac}

let silentEl=null,speechReady=false;
function silentWav(){const n=4410,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,t)=>[...t].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,22050,true);v.setUint32(28,44100,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  let bin='';new Uint8Array(b).forEach(x=>bin+=String.fromCharCode(x));return 'data:audio/wav;base64,'+btoa(bin)}
function unlock(){
  const a=ctx();
  if(a&&a.state!=='running'){try{const buf=a.createBuffer(1,1,22050),src=a.createBufferSource();src.buffer=buf;src.connect(a.destination);src.start(0)}catch(e){}}
  if(!silentEl){try{silentEl=new Audio(silentWav());silentEl.loop=true;silentEl.setAttribute('playsinline','');silentEl.volume=0.01;const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{silentEl=null})}catch(e){silentEl=null}}
  else if(silentEl.paused){silentEl.play().catch(()=>{})}
  if(!speechReady&&'speechSynthesis' in window){speechReady=true;try{const u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}catch(e){}}
}

function tone(f,t0,dur,type='sine',vol=.18,f2){const a=ctx();if(!a||!S.settings.sound)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.05)}
function meow(p=1){const a=ctx();if(!a||!S.settings.sound)return;const o=a.createOscillator(),g=a.createGain(),lp=a.createBiquadFilter(),t=a.currentTime;o.type='sawtooth';lp.type='lowpass';lp.frequency.value=1700;o.frequency.setValueAtTime(560*p,t);o.frequency.linearRampToValueAtTime(920*p,t+.15);o.frequency.linearRampToValueAtTime(620*p,t+.45);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16,t+.05);g.gain.setValueAtTime(.16,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+.5);o.connect(lp).connect(g).connect(a.destination);o.start(t);o.stop(t+.55)}

/* game */
let R=null,lastKey='';
function makeProblem(){
  const st=S.settings,ops=[];if(st.add)ops.push('+');if(st.sub)ops.push('-');if(!ops.length)ops.push('+');
  const M=st.max;let op,a,b,ans,k,guard=0;
  do{op=ops[rand(0,ops.length-1)];
    if(op==='+'){ans=rand(2,M);a=rand(1,ans-1);b=ans-a}else{a=rand(2,M);b=rand(1,a-1);ans=a-b}
    k=a+op+b}while(k===lastKey&&guard++<20);
  lastKey=k;const set=new Set([ans]);let g=0;
  while(set.size<3&&g++<60){const c=ans+[-3,-2,-1,1,2,3][rand(0,5)];if(c>=0&&c<=M+3)set.add(c)}
  return{a,b,op,ans,choices:shuffle([...set])};
}

  else $('fish').innerHTML=Array.from({length:p.a},(_,i)=>`<span class="${i>=p.a-p.b?'gone':''}">${FISH('#ff8a3d')}</span>`).join('')}
const sayProb=()=>speak(`What is ${R.p.a} ${R.p.op==='+'?'plus':'take away'} ${R.p.b}?`);
function startRound(){R={i:0,first:0,results:[],kittens:[],streak:0,zoom:0};$('streak').textContent='';$('hcount').textContent='0';show('play');nextQ()}
function nextQ(){
  if(R.i>=S.settings.count)return endRound();
  R.p=makeProblem();R.missed=false;R.lock=false;R.breed=pickLost();
  const L=$('lost');L.style.transition='none';L.className='lost';L.style.left=rand(0,1)?'7%':'35%';L.innerHTML=catSVG(R.breed);void L.offsetWidth;L.style.transition='';

  }
});
$('hear').addEventListener('click',sayProb);
$('quit').addEventListener('click',()=>{try{speechSynthesis.cancel()}catch(e){}show('home')});

function pickLost(){
  const normal=BREEDS.filter(b=>!b.magic),fresh=normal.filter(b=>!S.unlocked.includes(b.id)&&!R.kittens.includes(b.id));
  if(fresh.length&&Math.random()<.3)return fresh[rand(0,fresh.length-1)].id;
  const magic=BREEDS.filter(b=>b.magic&&S.unlocked.includes(b.id));
  if(magic.length&&Math.random()<.12)return magic[rand(0,magic.length-1)].id;
  let id,g=0;do{id=normal[rand(0,normal.length-1)].id}while(R.kittens.slice(-2).includes(id)&&g++<10);return id;
}
function zoomies(){
  R.zoom+=3;const z=$('zoom'),zb=$('zban');z.innerHTML=catSVG(S.unlocked[rand(0,S.unlocked.length-1)]);
  zb.textContent=['ZOOMIES!','SUPER SPEED!','KITTY ROCKET!'][rand(0,2)];
  [z,zb].forEach(e=>{e.classList.remove('run');void e.offsetWidth;e.classList.add('run')});
  setTimeout(()=>{tone(523,0,.12,'square',.06);tone(659,.1,.12,'square',.06);tone(784,.2,.12,'square',.06);tone(1047,.3,.3,'square',.06)},150);
}
function endRound(){
  const perfect=R.first===R.results.length;
  const go=()=>fishCatch(c=>finish(perfect,c));
  if(perfect)parade(R.kittens,go);else go();
}
function finish(perfect,caught){
  const n=R.results.length,oldL=level();
  const parts=[[R.first,'for right answers']];if(perfect)parts.push([5,'perfect bonus']);if(R.zoom)parts.push([R.zoom,'zoomies bonus']);if(caught)parts.push([caught,'fish caught']);
  const earned=parts.reduce((a,p)=>a+p[0],0);
  S.rounds++;S.treats+=earned;let nb=null;
  if(perfect){S.perfects++;nb=BREEDS.find(b=>b.magic&&!S.unlocked.includes(b.id));if(nb)S.unlocked.push(nb.id)}
  const newL=level(),lvItems=ITEMS.filter(i=>i.lv&&i.lv<=newL&&!S.items.includes(i.id));
  lvItems.forEach(i=>S.items.push(i.id));
  const pool=ITEMS.filter(i=>!i.lv&&!S.items.includes(i.id)),gift=pool.length?pool[rand(0,pool.length-1)]:null;
  if(gift)S.items.push(gift.id);else S.treats+=5;
  save();
  $('rTitle').textContent=perfect?'Purr-fect!':`${n} kittens home!`;
  const ns=perfect?3:R.first>=n*.7?2:1,STAR='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.9 6.2 6.6.8-4.9 4.6 1.3 6.6L12 16.9 6.1 20.2l1.3-6.6L2.5 9l6.6-.8z" fill="#ffc83d" stroke="#d99a00" stroke-width="1" stroke-linejoin="round"/><path d="M9 8l1.5-.2" stroke="#fff" stroke-width="1.4" stroke-linecap="round"/></svg>';
  $('rStars').innerHTML=[0,1,2].map(i=>i<ns?STAR:STAR.replace('<svg ','<svg class="off" ')).join('');
  $('rKits').innerHTML=R.kittens.map((k,i)=>`<div class="rk">${catSVG(k)}${R.results[i]?'<b>★</b>':''}</div>`).join('');
  $('rPet').innerHTML=petSVG();
  $('rTreats').innerHTML=`+${earned} fish for ${S.petName}!<br><span class="small" style="font-size:15px;display:block;line-height:1.3">${parts.map(p=>`+${p[0]} ${p[1]}`).join('<br>')}</span>`;
  $('present').innerHTML=`<button class="gift" id="giftBtn" aria-label="Open your present">${PRESENT}</button><p class="small" style="font-weight:700;font-size:20px;opacity:1">A present! Tap to open!</p>`;
  $('giftBtn').onclick=()=>{
    const g=$('giftBtn');if(g.classList.contains('open'))return;g.classList.add('open');tone(660,0,.1);tone(990,.1,.1);tone(1320,.2,.3);
    setTimeout(()=>{
      if(gift){$('present').innerHTML=`<div class="reveal"><div class="gk">${catSVG(S.petBreed,{wear:Object.assign({},S.wear,{[gift.slot]:gift.id})})}</div>${gift.name} for ${S.petName}!<br><button class="soft" id="wearIt" style="margin-top:8px">Wear it!</button></div>`;speak(`You got a ${gift.name}!`);
        $('wearIt').onclick=e=>{S.wear[gift.slot]=gift.id;save();$('rPet').innerHTML=petSVG();e.target.textContent='Looking good!';meow(1.2)}}
      else{$('present').innerHTML=`<div class="reveal">5 extra fish for ${S.petName}!</div>`;speak('Five extra fish!')}
      sparks($('present'));confetti(30);
    },450);
  };
  let news='';
  if(newL>oldL){const t=TRICKS.find(t=>t.l===newL);news+=`<div class="news">${S.petName} grew! Now a ${SIZES[newL].toLowerCase()}.${t?`<br>New trick: ${t.n}!`:''}${lvItems.map(i=>`<br>Special gift: ${i.name}!`).join('')}</div>`}
  if(nb)news+=`<div class="news"><div class="nk">${catSVG(nb.id)}</div>A magic kitten found you: ${nb.name}!<br><span style="font-size:16px">Magic kittens sometimes get lost too!</span></div>`;
  $('rNews').innerHTML=news;$('rNews').style.cssText='display:flex;flex-direction:column;gap:10px;width:100%';
  $('rTip').textContent=perfect?'Visit the magic wardrobe to dress up your kitten!':`Get all ${n} right on the first try for a Kitten Parade and a magic kitten!`;
  show('results');flyFish(earned);if(newL>oldL||nb){confetti(40);meow(1.2)}
  if(!perfect)speak(`You rescued ${n} kittens!`);
}
function fishCatch(done){
  const C=$('catch'),A=$('catchArea'),bar=$('catchBar');C.hidden=false;A.innerHTML='';
  let caught=0,timer=null;$('catchN').textContent='0';
  $('catchMsg').textContent='Bonus! Catch the fish!';speak(`Bonus game! Tap the fish for ${S.petName}!`);
  bar.style.transition='none';bar.style.width='100%';
  const spawn=()=>{
    const gold=Math.random()<.15,f=document.createElement('button');
    f.className='ff'+(gold?' gold':'');f.setAttribute('aria-label',gold?'Golden fish':'Fish');
    f.innerHTML=FISH(gold?'#ffc83d':['#ff8a3d','#5fa8e0','#ff8fa3','#7cd36b'][rand(0,3)]);
    f.style.left=rand(2,78)+'%';f.style.animationDuration=(2.8+Math.random()*1.6)+'s';
    f.addEventListener('pointerdown',e=>{
      e.preventDefault();if(f.dataset.got)return;f.dataset.got=1;
      const tr=getComputedStyle(f).transform;f.style.animation='none';f.style.transform=tr;f.classList.add('got');
      const v=gold?3:1;caught+=v;$('catchN').textContent=caught;tone(gold?1320:900+caught*15,0,.12,'sine',.15);if(gold)tone(1760,.08,.2,'sine',.12);
      const p=document.createElement('span');p.className='plus1';p.textContent='+'+v;p.style.left=e.clientX-14+'px';p.style.top=e.clientY-30+'px';C.appendChild(p);
      setTimeout(()=>{f.remove();p.remove()},1000);
    });
    f.addEventListener('animationend',ev=>{if(ev.target===f&&!f.dataset.got)f.remove()});
    A.appendChild(f);
  };
  setTimeout(()=>{
    requestAnimationFrame(()=>{bar.style.transition='width 12s linear';bar.style.width='0%'});
    spawn();timer=setInterval(spawn,450);
    setTimeout(()=>{
      clearInterval(timer);A.innerHTML='';
      $('catchMsg').textContent=`You caught ${caught} fish!`;speak(`You caught ${caught} fish!`);ding();
      setTimeout(()=>{C.hidden=true;done(caught)},2200);
    },12000);
  },1600);
}
function flyFish(n){const box=$('rPet');for(let i=0;i<Math.min(n,12);i++){setTimeout(()=>{const d=document.createElement('div');d.className='flyFish';d.innerHTML=FISH('#ff8a3d');box.appendChild(d);setTimeout(()=>d.remove(),1100);tone(1200+i*40,0,.08,'sine',.08)},i*180)}}

function parade(kits,done){
  const P=$('parade');P.hidden=false;
  const list=[S.petBreed,...kits];
  $('march').innerHTML=list.map((k,i)=>`<div class="marcher" style="animation-delay:${i*.45}s;left:-120px">${i===0?petSVG():catSVG(k)}</div>`).join('');
  confetti(100);tune();speak('Perfect! Kitten parade!');
  let ended=false;const end=()=>{if(ended)return;ended=true;P.hidden=true;P.removeEventListener('click',end);done()};
  setTimeout(()=>P.addEventListener('click',end),800);
  setTimeout(end,7000+list.length*450);
}

/* magic wardrobe */
function openWardrobe(){const w=$('wbox');w.classList.remove('open');renderWardrobe();setTimeout(()=>{w.classList.add('open');tone(392,0,.3,'triangle',.1);tone(523,.2,.4,'triangle',.1)},350)}
function renderWardrobe(){
  $('wPet').innerHTML=petSVG();
  let h=SLOTS.map(([slot,label])=>`<h3>${label}</h3><div class="wgrid">`+ITEMS.filter(i=>i.slot===slot).map(i=>S.items.includes(i.id)
    ?`<button class="wi${S.wear[slot]===i.id?' on':''}" data-i="${i.id}">${catSVG(S.petBreed,{wear:{[slot]:i.id}})}<span>${i.name}</span></button>`
    :`<div class="wi locked">${PRESENT}<span>${i.lv?'Grow bigger!':'In a present'}</span></div>`).join('')+'</div>').join('');
  h+=`<h3>Fur coat</h3><div class="wgrid">`+S.unlocked.map(id=>`<button class="wi${S.petBreed===id?' on':''}" data-c="${id}">${catSVG(id)}<span>${BREEDS.find(b=>b.id===id).name}</span></button>`).join('')+'</div>';
  $('wList').innerHTML=h;
}
$('wList').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.i){const it=IT[b.dataset.i];S.wear[it.slot]=S.wear[it.slot]===it.id?null:it.id}
  if(b.dataset.c)S.petBreed=b.dataset.c;
  save();renderWardrobe();meow(.9+Math.random()*.4);
  const p=$('wPet');p.classList.remove('t-hop');void p.offsetWidth;p.classList.add('t-hop');
});
$('wPet').addEventListener('click',()=>{meow(1.1);const p=$('wPet');p.classList.remove('t-wiggle');void p.offsetWidth;p.classList.add('t-wiggle')});
$('wardBtn').addEventListener('click',()=>show('wardrobe'));
$('wardBack').addEventListener('click',()=>show('home'));

/* cat house */
function renderHouse(){
  const tot=Object.values(S.rescued).reduce((a,b)=>a+b,0);
  $('houseSum').textContent=`${tot} kittens rescued · ${S.unlocked.length} of ${BREEDS.length} kinds found`;
  $('grid').innerHTML=BREEDS.map(b=>S.unlocked.includes(b.id)?`<div class="slot">${catSVG(b.id)}${b.name}<span>× ${S.rescued[b.id]||0}</span></div>`:`<div class="slot locked">${catSVG(b.id)}???<span>${b.magic?'Perfect round':'Still lost!'}</span></div>`).join('');
}

/* settings, press and hold */
let holdT=null;const gear=$('gear');
const holdEnd=()=>{clearTimeout(holdT);gear.classList.remove('hold')};
gear.addEventListener('pointerdown',e=>{e.preventDefault();gear.classList.add('hold');holdT=setTimeout(()=>{holdEnd();openSettings()},1200)});
['pointerup','pointerleave','pointercancel'].forEach(ev=>gear.addEventListener(ev,holdEnd));
gear.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openSettings()}});
gear.addEventListener('contextmenu',e=>e.preventDefault());
let resetArm=false;
function seg(key,opts){return`<div class="seg">${opts.map(([v,l])=>`<button data-k="${key}" data-v="${v}" class="${String(S.settings[key])===String(v)?'on':''}">${l}</button>`).join('')}</div>`}
function openSettings(){
  resetArm=false;const st=S.settings;
  $('panel').innerHTML=`<h2>Grown-up settings</h2>
  <div><label class="l" for="nm">Pet kitten's name</label><input id="nm" type="text" maxlength="16" value="${S.petName.replace(/"/g,'&quot;')}"></div>
  <div><label class="l">Math</label><div class="seg"><button data-t="add" class="${st.add?'on':''}">Adding +</button><button data-t="sub" class="${st.sub?'on':''}">Taking away −</button></div></div>
  <div><label class="l">Numbers up to</label>${seg('max',[[5,'5'],[10,'10'],[15,'15'],[20,'20']])}</div>
  <div><label class="l">Kittens per round</label>${seg('count',[[5,'5'],[10,'10'],[15,'15']])}</div>
  <div><label class="l">Counting fish helper</label>${seg('hint',[['always','Always'],['mistake','After a mistake'],['never','Never']])}</div>
  <div><label class="l">Read problems out loud</label>${seg('voice',[[true,'On'],[false,'Off']])}</div>
  <div><label class="l">Sounds</label>${seg('sound',[[true,'On'],[false,'Off']])}</div>
  <div><button class="soft" id="testSnd">Test sound</button> <span class="small" id="sndInfo"></span></div>
  <div class="row"><button class="soft danger" id="reset">Reset all progress</button><button class="candy" id="done">Done</button></div>`;
  $('settings').hidden=false;
}
$('panel').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const st=S.settings;
  const nm=$('nm');if(nm&&nm.value.trim())S.petName=nm.value.trim();
  if(b.dataset.t){st[b.dataset.t]=!st[b.dataset.t];if(!st.add&&!st.sub)st.add=true;openSettings()}
  else if(b.dataset.k){let v=b.dataset.v;v=v==='true'?true:v==='false'?false:isNaN(v)?v:+v;st[b.dataset.k]=v;openSettings()}
  else if(b.id==='reset'){if(!resetArm){resetArm=true;b.textContent='Tap again to erase everything';return}const keep=S.settings;S=JSON.parse(JSON.stringify(DEF));S.settings=keep;save();openSettings();renderHome()}
  else if(b.id==='testSnd'){unlock();const was=S.settings.sound;S.settings.sound=true;meow();ding();S.settings.sound=was;const v=S.settings.voice;S.settings.voice=true;speak('Meow! Can you hear me?');S.settings.voice=v;$('sndInfo').textContent='Sound engine: '+(ac?ac.state:'not available');return}
  else if(b.id==='done'){const n=$('nm').value.trim();if(n)S.petName=n;save();$('settings').hidden=true;renderHome()}
  if(b.dataset.t||b.dataset.k){const n=$('nm');if(n&&n.value.trim())S.petName=n.value.trim()}
  save();
});

$('playBtn').addEventListener('click',()=>{ctx();startRound()});
$('again').addEventListener('click',startRound);
$('rHome').addEventListener('click',()=>show('home'));
$('houseBtn').addEventListener('click',()=>show('catHouse'));
$('houseBack').addEventListener('click',()=>show('home'));
renderHome();
}
